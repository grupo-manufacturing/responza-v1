<!doctype html>
<html lang="en-IN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Light is the default. Apply a saved choice before first paint so the page never flashes the wrong theme.
      try {
        var t = localStorage.getItem('responza-theme')
        if (t === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#060608')
        }
      } catch (e) {}
    </script>
    <title>Responza AI: WhatsApp &amp; Instagram Inbox | Open Testing</title>
    <meta
      name="description"
      content="Responza puts WhatsApp Business and Instagram DMs in one AI inbox. Draft replies, translate and summarise chats in seconds. Join the open test on Google Play."
    />
